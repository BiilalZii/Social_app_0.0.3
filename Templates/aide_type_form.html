{% extends "base.html" %}
{% block title %}تعديل نوع منحة{% endblock %}
{% block content %}
<h4 class="mb-3">تعديل: {{ t.Type_AIDE }}</h4>
<div class="card p-4" style="max-width:400px">
    <form method="post">
        <div class="mb-3">
            <label class="form-label">القيمة الافتراضية</label>
            <input type="number" step="0.01" name="value" class="form-control" value="{{ t.Value }}">
        </div>
        <div class="mb-3">
            <label class="form-label">الوصف</label>
            <input type="text" name="description" class="form-control" value="{{ t.Description or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">حفظ</button>
        <a href="{{ url_for('aide_types') }}" class="btn btn-secondary">إلغاء</a>
    </form>
</div>
{% endblock %}
