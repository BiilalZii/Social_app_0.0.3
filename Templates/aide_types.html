{% extends "base.html" %}
{% block title %}أنواع المنح{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-tags me-2"></i>أنواع المنح والقيم الافتراضية</h4>
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr><th>النوع</th><th>القيمة الافتراضية</th><th>الوصف</th><th></th></tr></thead>
            <tbody>
            {% for t in types %}
            <tr>
                <td>{{ t.Type_AIDE }}</td>
                <td>{{ "{:,.0f}".format(t.Value) }}</td>
                <td>{{ t.Description or '-' }}</td>
                <td><a href="{{ url_for('edit_aide_type', type_aide=t.Type_AIDE) }}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a></td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
